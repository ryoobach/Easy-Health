name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: easy-health-android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent Android debug signing key
        id: android-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-health-debug-signing-key-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify persistent signing key was restored
        if: steps.android-signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'ERROR: The original Easy Health signing key was not restored.'
          echo 'Refusing to create a new key because it would prevent upgrading over the installed app.'
          exit 1
      - name: Confirm APK signing certificate
        run: keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK with app version
        run: cp app/build/outputs/apk/debug/app-debug.apk "이지헬스 1.10.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: 이지헬스-1.09
          path: "이지헬스 1.10.apk"

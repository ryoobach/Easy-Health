name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: easy-health-android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-health-debug-signing-key-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create persistent debug signing key when absent
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK with app version
        run: cp app/build/outputs/apk/debug/app-debug.apk "이지헬스 1.09.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: 이지헬스-1.09
          path: "이지헬스 1.09.apk"

name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: easy-health-android-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore persistent Android signing key
        id: android-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-health-debug-signing-key-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require the established signing key
        if: steps.android-signing-cache.outputs.cache-hit != 'true'
        run: |
          echo 'ERROR: The established Easy Health signing key was not restored.'
          echo 'A new key would break in-place updates, so this build is stopped.'
          exit 1
      - name: Record established signing certificate
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK with the established signing key
        run: gradle --no-daemon --no-build-cache --rerun-tasks assembleDebug
      - name: Verify update identity and version
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_ANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          test -n "$APK_ANALYZER"
          APP_ID="$("$APK_ANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APK_ANALYZER" manifest version-code "$APK")"
          echo "Application ID: $APP_ID"
          echo "Version code: $VERSION_CODE"
          test "$APP_ID" = "com.ryoo.easyhealth"
          test "$VERSION_CODE" -ge 28
      - name: Verify APK uses the established signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          KEY_SHA="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print tolower($1)}')"
          APK_SHA="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Signing key SHA-256: $KEY_SHA"
          echo "APK certificate SHA-256: $APK_SHA"
          EXPECTED_SHA="e71f6e2cba41d3caef823be573636aaa1065e84022bcd7031cb4531b476b0354"
          test -n "$APK_SHA"
          test "$KEY_SHA" = "$EXPECTED_SHA"
          test "$APK_SHA" = "$EXPECTED_SHA"
      - name: Name APK with app version
        run: |
          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "Easy-Health-$APP_VERSION.apk"
          mkdir -p "Easy-Health-$APP_VERSION"
          cp "Easy-Health-$APP_VERSION.apk" "Easy-Health-$APP_VERSION/"
          printf "Easy Health 설치 안내\\n기존 앱을 삭제하지 말고 APK를 설치하세요.\\n서명 불일치 또는 앱 설치 오류가 나오면 기존 앱을 삭제하지 말고 오류 내용을 알려주세요.\\n" > "Easy-Health-$APP_VERSION/설치안내.txt"
          zip -r "Easy-Health-$APP_VERSION.zip" "Easy-Health-$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Health-${{ env.APP_VERSION }}
          path: "Easy-Health-${{ env.APP_VERSION }}.zip"

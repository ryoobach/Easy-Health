name: Inspect feedback reference images
on:
  push:
    branches: [ "build/v1.47-feedback-implementation" ]
permissions:
  contents: read
jobs:
  package-reference-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: feedback-source
      - name: Package feedback reference images
        run: |
          test -s feedback-source/feedback.jpg
          test -s feedback-source/feedback.png
          mkdir -p reference-images
          cp feedback-source/feedback.jpg feedback-source/feedback.png reference-images/
      - uses: actions/upload-artifact@v4
        with:
          name: Easy-Health-feedback-reference-images
          path: reference-images/
          if-no-files-found: error
